name: Configure mc-content git access
description: Use MC_CONTENT_DEPLOY_KEY (SSH) or RESOURCES_GIT_TOKEN (HTTPS) for private notes repo
inputs:
  deploy_key:
    description: Read-only deploy key private key (PEM)
    required: false
    default: ""
  git_token:
    description: PAT with read access to mc-content (HTTPS fallback)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Configure SSH or HTTPS for mc-content
      shell: bash
      env:
        MC_CONTENT_DEPLOY_KEY: ${{ inputs.deploy_key }}
        RESOURCES_GIT_TOKEN: ${{ inputs.git_token }}
      run: |
        if [ -n "$MC_CONTENT_DEPLOY_KEY" ]; then
          mkdir -p ~/.ssh
          printf '%s\n' "$MC_CONTENT_DEPLOY_KEY" > ~/.ssh/mc_content_deploy
          chmod 600 ~/.ssh/mc_content_deploy
          {
            echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/mc_content_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            echo "RESOURCES_GIT_URL=git@github.com:MyConspect/mc-content.git"
          } >> "$GITHUB_ENV"
          echo "mc-content: using deploy key (SSH)"
          exit 0
        fi
        if [ -n "$RESOURCES_GIT_TOKEN" ]; then
          echo "mc-content: using RESOURCES_GIT_TOKEN (HTTPS)"
          exit 0
        fi
        echo "::error::Set MC_CONTENT_DEPLOY_KEY (recommended) or RESOURCES_GIT_TOKEN on MyConspect/mc-app. See README § CI/CD."
        exit 1