name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RESOURCES_GIT_URL: ${{ secrets.RESOURCES_GIT_URL }}
      RESOURCES_GIT_TOKEN: ${{ secrets.RESOURCES_GIT_TOKEN }}
      RESOURCES_GIT_REF: ${{ secrets.RESOURCES_GIT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fetch study notes
        run: npm run ensure-resources
      - run: npm run lint
      - run: npm test
      - run: npm run check-order -- --strict
      - run: npm run build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: vercel-production
      cancel-in-progress: true
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RESOURCES_GIT_URL: ${{ secrets.RESOURCES_GIT_URL }}
      RESOURCES_GIT_TOKEN: ${{ secrets.RESOURCES_GIT_TOKEN }}
      RESOURCES_GIT_REF: ${{ secrets.RESOURCES_GIT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Require Vercel secrets
        run: |
          missing=
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret $name (see README CI/CD)."
              missing=1
            fi
          done
          if [ -n "$missing" ]; then exit 1; fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fetch study notes
        run: npm run ensure-resources
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production
      - name: Build for production
        run: vercel build --prod
      - name: Deploy to production
        run: vercel deploy --prebuilt --prod

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RESOURCES_GIT_URL: ${{ secrets.RESOURCES_GIT_URL }}
      RESOURCES_GIT_TOKEN: ${{ secrets.RESOURCES_GIT_TOKEN }}
      RESOURCES_GIT_REF: ${{ secrets.RESOURCES_GIT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Fetch study notes
        run: npm run ensure-resources
      - uses: cypress-io/github-action@v7.4.6
        with:
          install: false
          browser: chrome
          build: npm run build
          start: npm run start:e2e
          wait-on: "http://127.0.0.1:3456"
          wait-on-timeout: 120
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
